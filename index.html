<!doctype html>
<html lang="en">

<head>
  <base href="/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="Description" content="Demonstration for haxcms-settings-panel">

  <style>
    :root, html, body {
      margin: var(--ddd-spacing-0);
      padding: var(--ddd-spacing-0);
    }
    #demo {
      margin: var(--ddd-spacing-2);
    }

    haxcms-settings-panel:hover {
      box-shadow: var(--ddd-boxShadow-sm);
    }
    #example {
      --haxcms-settings-panel-font-size: var(--ddd-font-size-l);
      background-color: var(--ddd-accent-2);
      color: var(--ddd-primary-17);
    }
  </style>
  <title>haxcms-settings-panel</title>
</head>

<body>
  <div id="demo">
    <haxcms-settings-panel 
    id = "settings-panel"
    title="JS/CSS" 
    breadcrumbs='[
    {"icon": "settings", "label": "Settings"},
    {"icon": "code", "label": "JS/CSS"}
    ]'
    description="Insert your own JavaScript or CSS file to make your HAX site more customizable."
    actionButton="Save"
    panelVisible="true">
      <code-editor id = "editor" language="javascript"></code-editor>
    </haxcms-settings-panel>
  </div>
  <script type="module">
    import "./haxcms-settings-panel.js";
    import "@haxtheweb/code-editor/code-editor.js";

    const panel = document.querySelector("#settings-panel");
    const editor = document.querySelector("#editor");

    panel.addEventListener("language-change", (e) => {
      console.log("Language changed to: ", e.detail.language);
      editor.setAttribute("language", e.detail.language);
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <base href="/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="Description" content="Demonstration for haxcms-settings-panel">

  <style>
    :root, html, body {
      margin: var(--ddd-spacing-0);
      padding: var(--ddd-spacing-0);
    }
    #demo {
      margin: var(--ddd-spacing-2);
    }

    haxcms-settings-panel:hover {
      box-shadow: var(--ddd-boxShadow-sm);
    }
    #example {
      --haxcms-settings-panel-font-size: var(--ddd-font-size-l);
      background-color: var(--ddd-accent-2);
      color: var(--ddd-primary-17);
    }
    code-editor[hidden] {
      display: none !important;
    }
  </style>
  <title>haxcms-settings-panel</title>
</head>

<body>
  <div id="demo">
    <haxcms-settings-panel 
    id = "settings-panel"
    title="JS/CSS" 
    breadcrumbs='[
    {"icon": "settings", "label": "Settings", "screen": "settings"},
    {"icon": "code", "label": "JS/CSS", "screen": "code"}
    ]'
    description="Insert your own JavaScript or CSS file to make your HAX site more customizable."
    actionButton="Save"
    panelVisible="true">
      <haxcms-code-workspace>
        <code-editor id="javascript-editor" language="javascript" title="JavaScript"></code-editor>
        <code-editor id="css-editor" language="css" title="CSS" hidden></code-editor>
      </haxcms-code-workspace>
    </haxcms-settings-panel>
  </div>
  <script type="module">
    import "./haxcms-settings-panel.js";
    import "./haxcms-code-workspace.js";
    import "@haxtheweb/code-editor/code-editor.js";

    const panel = document.querySelector("#settings-panel");
    // Keep both editors mounted so each language retains its own draft.
    const editors = {
      javascript: document.querySelector("#javascript-editor"),
      css: document.querySelector("#css-editor"),
    };

    panel.addEventListener("language-change", (e) => {
      const language = e.detail.language;
      if (!Object.hasOwn(editors, language)) return;

      document.querySelector("haxcms-code-workspace").selectedLanguage = language;

      for (const [name, editor] of Object.entries(editors)) {
        editor.hidden = name !== language;
      }
    });

    let saving = false;

    panel.addEventListener("save-request", async (event) => {
      if (saving) return;

      const language = event.detail.language;
      if (!Object.hasOwn(editors, language)) return;

      saving = true;
      try {
        const response = await fetch("/mock-save-code", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            language,
            code: editors[language].value ?? "",
          }),
        });

        if (!response.headers.get("content-type")?.includes("application/json")) {
          throw new Error(
            `Save endpoint returned HTTP ${response.status} instead of JSON. Restart vercel dev and reload this page.`,
          );
        }

        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.message || "Unable to save.");
        }

        alert(`${language === "css" ? "CSS" : "JavaScript"} saved.`);
      } catch (error) {
        alert(`Save failed: ${error.message}`);
      } finally {
        saving = false;
      }
    });

    panel.addEventListener("breadcrumb-click", (e) => {
      console.log("Navigate to:", e.detail.screen);
    })
  </script>
</body>
</html>

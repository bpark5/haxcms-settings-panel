<!doctype html>
<html lang="en">

<head>
  <base href="/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="Description" content="Demonstration for haxcms-settings-panel">

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--ddd-theme-default-potentialMidnight, #000321);
    }

    code-editor[hidden] {
      display: none !important;
    }
  </style>
  <title>haxcms-settings-panel</title>
</head>

<body>
  <div id="demo">
    <haxcms-settings-panel 
    id = "settings-panel"
    title="JS/CSS" 
    breadcrumbs='[
    {"icon": "settings", "label": "System Settings", "screen": "settings"},
    {"icon": "code", "label": "JS/CSS", "screen": "code"}
    ]'
    description="Insert your own JavaScript or CSS file to make your HAX site more customizable."
    actionButton="Save"
    panelVisible="true">
      <haxcms-code-workspace>
        <code-editor id="javascript-editor" language="javascript" title="JavaScript" font-size="14"></code-editor>
        <code-editor id="css-editor" language="css" title="CSS" hidden font-size="14"></code-editor>
      </haxcms-code-workspace>
    </haxcms-settings-panel>
  </div>
  <script type="module">
    import "./haxcms-settings-panel.js";
    import "./haxcms-code-workspace.js";
    import "@haxtheweb/code-editor/code-editor.js";
    import { saveMockCode } from "./lib/mock-authorization-client.js";

    const panel = document.querySelector("#settings-panel");
    // Keep both editors mounted so each language retains its own draft.
    const editors = {
      javascript: document.querySelector("#javascript-editor"),
      css: document.querySelector("#css-editor"),
    };

    panel.addEventListener("language-change", (e) => {
      const language = e.detail.language;
      if (!Object.hasOwn(editors, language)) return;

      document.querySelector("haxcms-code-workspace").selectedLanguage = language;

      for (const [name, editor] of Object.entries(editors)) {
        editor.hidden = name !== language;
      }
    });

    let saving = false;

    panel.addEventListener("save-request", async (event) => {
      if (saving) return;

      const language = event.detail.language;
      if (!Object.hasOwn(editors, language)) return;

      saving = true;
      panel.saving = true;
      const code = event.detail.code;
      try {
        const result = await saveMockCode({
          authorization: panel.authorization,
          language,
          code,
          reauthenticate: () => panel.requestReauthentication({ language, code }),
        });
        if (!result) return;

        document.querySelector("haxcms-code-workspace").markSaved(language, code);
        alert(`${language === "css" ? "CSS" : "JavaScript"} saved.`);
      } catch (error) {
        alert(`Save failed: ${error.message}`);
      } finally {
        saving = false;
        panel.saving = false;
      }
    });

    panel.addEventListener("breadcrumb-click", (e) => {
      console.log("Navigate to:", e.detail.screen);
    })
  </script>
</body>
</html>
